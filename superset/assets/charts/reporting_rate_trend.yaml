slice_name: "Reporting Rate Trend"
viz_type: echarts_timeseries_line
uuid: "c1d2e3f4-a5b6-4c7d-8e9f-000000000032"
version: "1.0.0"
dataset_uuid: "a1b2c3d4-e5f6-4a7b-8c9d-000000000030"
description: "Reporting rate over time, broken down by program. Each line shows the share of facilities that submitted a requisition for that program in each period."
certified_by: null
certification_details: null
is_managed_externally: false
cache_timeout: null
params:
  viz_type: echarts_timeseries_line
  x_axis: period_end_date
  time_grain_sqla: P1M
  metrics:
    # the saved reporting_rate metric, not a copy of its SQL: the skip policy lives in
    # exactly one place per dataset, so swapping it later moves every chart at once
    - reporting_rate
  groupby:
    - program_name
  adhoc_filters:
    - clause: WHERE
      expressionType: SIMPLE
      operator: TEMPORAL_RANGE
      operatorId: TEMPORAL_RANGE
      subject: period_end_date
      comparator: "Last 3 years"
    - clause: WHERE
      expressionType: SIMPLE
      operator: ==
      operatorId: EQUALS
      subject: in_complete_month
      comparator: 1
  row_limit: 10000
  order_desc: true
  color_scheme: supersetColors
  show_legend: true
  legendType: scroll
  legendOrientation: top
  x_axis_title: Period
  x_axis_title_margin: 40
  x_axis_time_format: "%b '%y"
  xAxisLabelRotation: 30
  y_axis_title: Reporting Rate
  y_axis_title_margin: 30
  y_axis_title_position: Top
  y_axis_format: ".0%"
  y_axis_bounds: [null, 1]
  rich_tooltip: true
  showTooltipTotal: false
  tooltipTimeFormat: "%b %Y"
  show_value: false
  markerEnabled: true
  markerSize: 6
  zoomable: true
  annotation_layers:
    - name: "Target 90%"
      annotationType: FORMULA
      sourceType: ""
      value: "0.9"
      style: dashed
      width: 2
      color: "#8B0000"
      opacity: ""
      show: true
      showLabel: true
      showMarkers: false
      hideLine: false
      overrides: {}
query_context: null
