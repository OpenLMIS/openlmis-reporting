slice_name: "% of Adjustments by Reason"
viz_type: pie
uuid: "c1d2e3f4-a5b6-4c7d-8e9f-000000000052"
version: "1.0.0"
dataset_uuid: "a1b2c3d4-e5f6-4a7b-8c9d-000000000050"
description: "Share of adjustment-line counts by reason. Legacy chart used 11 hardcoded SUM(CASE WHEN reason = X) metrics; this chart groups dynamically by reason_name so any new reason appears automatically."
certified_by: null
certification_details: null
is_managed_externally: false
cache_timeout: null
params:
  viz_type: pie
  groupby:
    - reason_name
  metric:
    expressionType: SQL
    sqlExpression: "COUNT(*)"
    label: "Adjustments"
  adhoc_filters:
    - clause: WHERE
      expressionType: SIMPLE
      operator: TEMPORAL_RANGE
      operatorId: TEMPORAL_RANGE
      subject: period_end_date
      comparator: "Last 3 years"
    - clause: WHERE
      expressionType: SIMPLE
      operator: ==
      operatorId: EQUALS
      subject: in_complete_month
      comparator: 1
  row_limit: 1000
  sort_by_metric: true
  color_scheme: supersetColors
  show_labels: true
  show_legend: true
  legendType: scroll
  legendOrientation: top
  label_type: key_value_percent
  number_format: ",.0f"
  date_format: smart_date
  show_labels_threshold: 1
  outerRadius: 70
  innerRadius: 30
query_context: null
