slice_name: "Consumption by District"
viz_type: echarts_timeseries_line
uuid: "c1d2e3f4-a5b6-4c7d-8e9f-000000000043"
version: "1.0.0"
dataset_uuid: "a1b2c3d4-e5f6-4a7b-8c9d-000000000010"
description: "Consumption per district over time. The dashboard Period filter sets the range; with nothing selected it shows the three years the mart retains. This is the quantity facilities reported consuming. The Adjusted Consumption Trend plots the same periods scaled up for stockout days, so its numbers run higher wherever products were unavailable."
certified_by: null
certification_details: null
is_managed_externally: false
cache_timeout: null
params:
  viz_type: echarts_timeseries_line
  x_axis: period_end_date
  time_grain_sqla: P1M
  metrics:
    - expressionType: SQL
      sqlExpression: "SUM(total_consumed_quantity)"
      label: "Consumption"
  groupby:
    - zone_name
  adhoc_filters:
    - clause: WHERE
      expressionType: SIMPLE
      operator: TEMPORAL_RANGE
      operatorId: TEMPORAL_RANGE
      subject: period_end_date
      comparator: "Last 3 years"
    - clause: WHERE
      expressionType: SIMPLE
      operator: ==
      operatorId: EQUALS
      subject: in_complete_month
      comparator: 1
  row_limit: 50000
  order_desc: true
  color_scheme: supersetColors
  show_legend: true
  legendType: scroll
  legendOrientation: top
  x_axis_title: Period
  x_axis_title_margin: 40
  x_axis_time_format: "%b '%y"
  xAxisLabelRotation: 30
  y_axis_title: Consumption
  y_axis_title_margin: 30
  y_axis_title_position: Top
  y_axis_format: ",.0f"
  rich_tooltip: true
  tooltipTimeFormat: "%b %Y"
  show_value: false
  markerEnabled: false
  markerSize: 6
  zoomable: true
query_context: null
