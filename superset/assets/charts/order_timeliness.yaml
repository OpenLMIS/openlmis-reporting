slice_name: "Order Timeliness"
viz_type: pie
uuid: "c1d2e3f4-a5b6-4c7d-8e9f-000000000064"
version: "1.0.0"
dataset_uuid: "a1b2c3d4-e5f6-4a7b-8c9d-000000000010"
description: "How many requisitions arrived early or late in the calendar month, against the cut-offs set in the dashboard filter bar (default: 1st to 10th on time, 11th to 15th late, 16th onwards extreme late). Counts distinct requisitions, the same unit as Emergency vs Regular Orders beside it, so the two charts on this dashboard can be read against each other. The day comes from the requisition's own SUBMITTED status change; about 6% of requisitions have no such record and are grouped as 'Submission date unknown' rather than dropped. Legacy chart was hardcoded to program_name = 'Essential Meds'; the migration drops that filter and exposes Program in the dashboard filter bar."
certified_by: null
certification_details: null
is_managed_externally: false
cache_timeout: null
params:
  viz_type: pie
  groupby:
    - submission_timeliness
  metric:
    expressionType: SIMPLE
    column:
      column_name: requisition_id
      type: String
    aggregate: COUNT_DISTINCT
    label: "Requisitions"
  adhoc_filters:
    - clause: WHERE
      expressionType: SIMPLE
      operator: TEMPORAL_RANGE
      operatorId: TEMPORAL_RANGE
      subject: period_end_date
      comparator: "Last 3 years"
    - clause: WHERE
      expressionType: SIMPLE
      operator: ==
      operatorId: EQUALS
      subject: in_complete_month
      comparator: 1
  row_limit: 25
  sort_by_metric: true
  color_scheme: supersetColors
  show_labels: true
  show_legend: true
  legendType: scroll
  legendOrientation: top
  label_type: key_value_percent
  number_format: ",.0f"
  date_format: smart_date
  show_labels_threshold: 0
  outerRadius: 70
  innerRadius: 30
query_context: null
