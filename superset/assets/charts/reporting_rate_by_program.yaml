slice_name: "Reporting Rate by Program"
viz_type: echarts_timeseries_bar
uuid: "c1d2e3f4-a5b6-4c7d-8e9f-000000000081"
version: "1.0.0"
dataset_uuid: "a1b2c3d4-e5f6-4a7b-8c9d-000000000030"
description: "Per-program reporting outcome as a 100% stacked bar: Reported, Skipped, and Did not report. Skipped means the facility deliberately skipped that period, which every program in the data is configured to allow; separating it stops a deliberate skip reading as a delinquent facility. Counts facility-program-period reporting obligations, not facilities. The reporting rate shown elsewhere still counts a skip as a miss, so the shares here will not add up to it. Replaces the legacy row of six hardcoded per-program pies and auto-adapts to whichever programs the adopter has configured."
certified_by: null
certification_details: null
is_managed_externally: false
cache_timeout: null
params:
  viz_type: echarts_timeseries_bar
  x_axis: program_name
  groupby:
    - reporting_status
  metrics:
    - expressionType: SQL
      sqlExpression: "COUNT(*)"
      label: "Obligations"
  adhoc_filters:
    - clause: WHERE
      expressionType: SIMPLE
      operator: TEMPORAL_RANGE
      operatorId: TEMPORAL_RANGE
      subject: period_end_date
      comparator: "Last 3 years"
    - clause: WHERE
      expressionType: SIMPLE
      operator: ==
      operatorId: EQUALS
      subject: in_complete_month
      comparator: 1
  contributionMode: row
  stack: Stack
  order_desc: false
  row_limit: 10000
  color_scheme: supersetColors
  show_legend: true
  legendType: scroll
  legendOrientation: top
  xAxisLabelRotation: 45
  y_axis_title: "Reporting share (%)"
  y_axis_title_margin: 30
  y_axis_title_position: Top
  y_axis_format: ".1%"
  y_axis_bounds: [null, 1]
  truncateYAxis: false
  rich_tooltip: true
  showTooltipTotal: false
  show_value: false
  zoomable: false
query_context: null
