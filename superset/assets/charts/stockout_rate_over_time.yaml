slice_name: "Stockout Rate Over Time"
viz_type: echarts_timeseries_line
uuid: "c1d2e3f4-a5b6-4c7d-8e9f-000000000016"
version: "1.0.0"
dataset_uuid: "a1b2c3d4-e5f6-4a7b-8c9d-000000000010"
description: "Share of product lines stocked out per period, not a share of facilities: the two readings are far apart, around 55% of lines against about 98% of facilities carrying at least one stocked-out line in the same month, so the unit matters. A line item is counted as stocked out on direct evidence only: stock_on_hand = 0 or total_stockout_days > 0 (the combined_stockout flag). Missing opening balances no longer count - they are bookkeeping gaps, and on migrated history they pinned this chart at 100%. Series are split by reporting cadence (the Schedule Type column): pooling monthly and quarterly reporters into one average made the line jump every third month, because the quarterly ones only join in the months that close a quarter. Split apart, each series is internally consistent; a quarterly cadence draws one point per quarter on the fixed monthly axis."
certified_by: null
certification_details: null
is_managed_externally: false
cache_timeout: null
params:
  viz_type: echarts_timeseries_line
  x_axis: period_end_date
  time_grain_sqla: P1M
  metrics:
    - expressionType: SQL
      sqlExpression: "AVG(combined_stockout)"
      label: "Product lines stocked out"
  groupby:
    - schedule_type
  adhoc_filters:
    - clause: WHERE
      expressionType: SIMPLE
      operator: TEMPORAL_RANGE
      operatorId: TEMPORAL_RANGE
      subject: period_end_date
      comparator: "Last 3 years"
    - clause: WHERE
      expressionType: SIMPLE
      operator: ==
      operatorId: EQUALS
      subject: in_complete_month
      comparator: 1
  row_limit: 10000
  order_desc: true
  color_scheme: supersetColors
  show_legend: true
  legendType: scroll
  legendOrientation: top
  x_axis_title: Period
  x_axis_title_margin: 40
  x_axis_time_format: "%b '%y"
  xAxisLabelRotation: 30
  y_axis_title: "% of product lines"
  y_axis_title_margin: 30
  y_axis_title_position: Top
  y_axis_format: ".0%"
  y_axis_bounds: [null, 1]
  rich_tooltip: true
  showTooltipTotal: false
  tooltipTimeFormat: "%b %Y"
  show_value: false
  markerEnabled: true
  markerSize: 6
  zoomable: true
query_context: null
