slice_name: "Consumption per District"
viz_type: echarts_timeseries_line
uuid: "c1d2e3f4-a5b6-4c7d-8e9f-000000000042"
version: "1.0.0"
dataset_uuid: "a1b2c3d4-e5f6-4a7b-8c9d-000000000010"
description: "Reported consumption as a share of adjusted consumption, per district (sum(total_consumed_quantity) / sum(adjusted_consumption)). Adjusted consumption scales the reported quantity up for days a product was out of stock, so this ratio is at most 1.0: it reads 1.0 in a district-month with no stockouts, and falls as stockouts take a larger share of the period. Measured across the mart it runs from 0.23 to 1.0."
certified_by: null
certification_details: null
is_managed_externally: false
cache_timeout: null
params:
  viz_type: echarts_timeseries_line
  x_axis: period_end_date
  time_grain_sqla: P1M
  metrics:
    - expressionType: SQL
      sqlExpression: "CASE WHEN SUM(adjusted_consumption) != 0 THEN SUM(total_consumed_quantity) / SUM(adjusted_consumption) ELSE NULL END"
      label: "Consumption / Adjusted Consumption"
  groupby:
    - zone_name
  adhoc_filters:
    - clause: WHERE
      expressionType: SIMPLE
      operator: TEMPORAL_RANGE
      operatorId: TEMPORAL_RANGE
      subject: period_end_date
      comparator: "Last 3 years"
    - clause: WHERE
      expressionType: SIMPLE
      operator: ==
      operatorId: EQUALS
      subject: in_complete_month
      comparator: 1
  row_limit: 10000
  order_desc: true
  color_scheme: supersetColors
  show_legend: true
  legendType: scroll
  legendOrientation: top
  x_axis_title: Period
  x_axis_title_margin: 40
  x_axis_time_format: "%b '%y"
  xAxisLabelRotation: 30
  # Short enough to fit vertically inside a half-height card - the full
  # wording overflowed into the legend row.
  y_axis_title: "Consumed / adjusted ratio"
  y_axis_title_margin: 60
  y_axis_format: ".2f"
  rich_tooltip: true
  showTooltipTotal: false
  tooltipTimeFormat: "%b %Y"
  show_value: false
  markerEnabled: false
  markerSize: 6
  zoomable: true
query_context: null
