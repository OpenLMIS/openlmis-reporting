slice_name: "Facilities Reporting Rate"
viz_type: echarts_timeseries_line
uuid: "c1d2e3f4-a5b6-4c7d-8e9f-000000000031"
version: "1.0.0"
dataset_uuid: "a1b2c3d4-e5f6-4a7b-8c9d-000000000030"
description: "Share of facility reporting obligations fulfilled per month, pooled across every programme in scope - one line, not one per programme. Reporting Rate Trend beside it is the per-programme breakdown of the same measure, so read this one for the headline and that one for which programme moves it. One obligation = one facility-program-period combination expected to report. Watch the Schedule Type filter here above all: weekly obligations are a third of the total and are almost never reported, so pooling everything reads about 48% where the monthly cadence alone reads about 73%."
certified_by: null
certification_details: null
is_managed_externally: false
cache_timeout: null
params:
  viz_type: echarts_timeseries_line
  x_axis: period_end_date
  time_grain_sqla: P1M
  metrics:
    # the saved reporting_rate metric, not a copy of its SQL: the skip policy lives in
    # exactly one place per dataset, so swapping it later moves every chart at once
    - reporting_rate
  groupby: []
  adhoc_filters:
    - clause: WHERE
      expressionType: SIMPLE
      operator: TEMPORAL_RANGE
      operatorId: TEMPORAL_RANGE
      subject: period_end_date
      comparator: "Last 3 years"
    - clause: WHERE
      expressionType: SIMPLE
      operator: ==
      operatorId: EQUALS
      subject: in_complete_month
      comparator: 1
  row_limit: 10000
  order_desc: true
  color_scheme: supersetColors
  show_legend: true
  legendType: scroll
  legendOrientation: top
  x_axis_title: Period
  x_axis_title_margin: 40
  x_axis_time_format: "%b '%y"
  xAxisLabelRotation: 30
  y_axis_title: Reporting Rate (all programmes pooled)
  y_axis_title_margin: 30
  y_axis_title_position: Top
  y_axis_format: ".0%"
  y_axis_bounds: [null, 1]
  rich_tooltip: true
  showTooltipTotal: false
  tooltipTimeFormat: "%b %Y"
  show_value: false
  markerEnabled: true
  markerSize: 6
  zoomable: true
query_context: null
