slice_name: "Stock Status Distribution Over Time"
viz_type: echarts_timeseries_bar
uuid: "c1d2e3f4-a5b6-4c7d-8e9f-000000000018"
version: "1.0.0"
dataset_uuid: "a1b2c3d4-e5f6-4a7b-8c9d-000000000010"
description: "Distinct facility count per stock_status category, stacked over time. Shows how many distinct facilities fall into each category (Stocked Out / Understocked / Adequately stocked / Overstocked / Unknown) for each reporting period. Bucketed by month so the axis shows the periods actually selected. A quarterly grain is the safer default only where monthly and quarterly reporters are mixed, because a quarterly reporter is absent from two months out of three; use the Time Grain filter to switch if that applies. Within a bucket a facility is counted once per status it held at any point in it, so a facility whose products sit in different categories, or which changed status inside the bucket, appears in more than one segment and stacked totals can exceed the number of reporting facilities. At month grain each month is its own bucket, so a short stockout no longer carries the same weight as a long one; that equivalence returns if the grain is widened."
certified_by: null
certification_details: null
is_managed_externally: false
cache_timeout: null
params:
  viz_type: echarts_timeseries_bar
  x_axis: period_end_date
  time_grain_sqla: P1M
  metrics:
    - expressionType: SIMPLE
      column:
        column_name: facility_id
        type: String
      aggregate: COUNT_DISTINCT
      label: "Facilities in this status"
  groupby:
    - stock_status
  adhoc_filters:
    - clause: WHERE
      expressionType: SQL
      sqlExpression: "stock_status IS NOT NULL"
      subject: stock_status
    - clause: WHERE
      expressionType: SIMPLE
      operator: TEMPORAL_RANGE
      operatorId: TEMPORAL_RANGE
      subject: period_end_date
      comparator: "Last 3 years"
    - clause: WHERE
      expressionType: SIMPLE
      operator: ==
      operatorId: EQUALS
      subject: in_complete_month
      comparator: 1
  row_limit: 10000
  order_desc: true
  color_scheme: supersetColors
  show_legend: true
  legendType: scroll
  legendOrientation: top
  x_axis_title: Period
  x_axis_title_margin: 40
  x_axis_time_format: "%b '%y"
  xAxisLabelRotation: 30
  y_axis_title: "Facilities per status"
  y_axis_title_margin: 60
  y_axis_format: ",.0f"
  stack: stack
  rich_tooltip: true
  showTooltipTotal: false
  tooltipTimeFormat: smart_date
  show_value: false
  zoomable: false
query_context: null
