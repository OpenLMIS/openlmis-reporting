slice_name: "Mathematical Error Trends"
viz_type: echarts_timeseries_line
uuid: "c1d2e3f4-a5b6-4c7d-8e9f-000000000056"
version: "1.0.0"
dataset_uuid: "a1b2c3d4-e5f6-4a7b-8c9d-000000000050"
description: "Trend in mathematical-error adjustments (positive + negative). Spikes indicate periods where requisitioners were resolving balance errors at scale, which can be a data-quality signal."
certified_by: null
certification_details: null
is_managed_externally: false
cache_timeout: null
params:
  viz_type: echarts_timeseries_line
  x_axis: period_end_date
  time_grain_sqla: P1M
  metrics:
    - expressionType: SQL
      sqlExpression: "SUM(adjustment_quantity)"
      label: "Adjusted Quantity"
  groupby:
    - reason_name
  adhoc_filters:
    - clause: WHERE
      expressionType: SQL
      sqlExpression: "lower(reason_name) IN ('positive mathematical error', 'negative mathematical error')"
      subject: reason_name
    - clause: WHERE
      expressionType: SIMPLE
      operator: TEMPORAL_RANGE
      operatorId: TEMPORAL_RANGE
      subject: period_end_date
      comparator: "Last 3 years"
    - clause: WHERE
      expressionType: SIMPLE
      operator: ==
      operatorId: EQUALS
      subject: in_complete_month
      comparator: 1
  row_limit: 10000
  order_desc: true
  color_scheme: supersetColors
  show_legend: true
  legendType: scroll
  legendOrientation: top
  x_axis_title: Period
  x_axis_title_margin: 40
  x_axis_time_format: "%b '%y"
  xAxisLabelRotation: 30
  y_axis_title: Adjusted Quantity
  y_axis_title_margin: 30
  y_axis_title_position: Top
  y_axis_format: ",.0f"
  rich_tooltip: true
  showTooltipTotal: false
  tooltipTimeFormat: "%b %Y"
  show_value: false
  markerEnabled: true
  markerSize: 6
  zoomable: true
query_context: null
