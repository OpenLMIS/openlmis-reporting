slice_name: "Months of Stock Over Time"
viz_type: echarts_timeseries_line
uuid: "c1d2e3f4-a5b6-4c7d-8e9f-000000000017"
version: "1.0.0"
dataset_uuid: "a1b2c3d4-e5f6-4a7b-8c9d-000000000010"
description: "Average months of stock per district over time. months_of_stock is computed as round(stock_on_hand / average_consumption, 1) per line item; the chart averages this across all line items in each district per period. Bucketed by quarter because this chart already spends its series dimension on district, so cadence cannot be split out the way it is on the pooled trend charts. A quarter is the grain at which a monthly and a quarterly reporter both land in every bucket, so neither leaves holes. Use the Time Grain filter to switch to months once a single cadence is selected."
certified_by: null
certification_details: null
is_managed_externally: false
cache_timeout: null
params:
  viz_type: echarts_timeseries_line
  x_axis: period_end_date
  time_grain_sqla: P3M
  metrics:
    - expressionType: SQL
      sqlExpression: "AVG(months_of_stock)"
      label: "Avg Months of Stock"
  groupby:
    - zone_name
  adhoc_filters:
    - clause: WHERE
      expressionType: SIMPLE
      operator: TEMPORAL_RANGE
      operatorId: TEMPORAL_RANGE
      subject: period_end_date
      comparator: "Last 3 years"
    - clause: WHERE
      expressionType: SIMPLE
      operator: ==
      operatorId: EQUALS
      subject: in_complete_month
      comparator: 1
  row_limit: 10000
  order_desc: true
  color_scheme: supersetColors
  show_legend: true
  legendType: scroll
  legendOrientation: top
  x_axis_title: Period
  x_axis_title_margin: 30
  y_axis_title: Months of Stock
  y_axis_title_margin: 40
  y_axis_format: ".1f"
  rich_tooltip: true
  showTooltipTotal: false
  tooltipTimeFormat: smart_date
  show_value: false
  markerEnabled: true
  markerSize: 6
  zoomable: true
query_context: null
