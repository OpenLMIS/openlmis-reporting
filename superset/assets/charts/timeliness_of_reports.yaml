slice_name: "Timeliness of Reports"
viz_type: echarts_timeseries_bar
uuid: "c1d2e3f4-a5b6-4c7d-8e9f-000000000082"
version: "1.0.0"
dataset_uuid: "a1b2c3d4-e5f6-4a7b-8c9d-000000000030"
description: "Share of submitted reports by when in the calendar month they arrived, one bar per period. Each bar sums to 100% of the reports submitted in that period, so periods with very different volumes stay comparable. The on-time and late boundaries come from the two cut-off filters in the filter bar and default to the 1st-10th on time, 11th-15th late, 16th onwards extreme late. Obligations that were never reported are not here on purpose: they would break the percentage. The chart to the right covers those."
certified_by: null
certification_details: null
is_managed_externally: false
cache_timeout: null
params:
  viz_type: echarts_timeseries_bar
  x_axis: period_end_date
  time_grain_sqla: P1M
  metrics:
    - expressionType: SIMPLE
      column:
        column_name: facility_id
        type: String
      aggregate: COUNT
      label: "Reports"
  groupby:
    - submission_timeliness
  adhoc_filters:
    - clause: WHERE
      expressionType: SIMPLE
      subject: reporting_status
      operator: "=="
      comparator: "Reported"
    - clause: WHERE
      expressionType: SIMPLE
      operator: TEMPORAL_RANGE
      operatorId: TEMPORAL_RANGE
      subject: period_end_date
      comparator: "Last 3 years"
    - clause: WHERE
      expressionType: SIMPLE
      operator: ==
      operatorId: EQUALS
      subject: in_complete_month
      comparator: 1
  row_limit: 10000
  order_desc: false
  sort_series_type: sum
  sort_series_ascending: false
  contributionMode: row
  stack: Stack
  color_scheme: supersetColors
  show_legend: true
  legendType: scroll
  legendOrientation: top
  x_axis_title: Period
  x_axis_title_margin: 40
  x_axis_time_format: "%b '%y"
  xAxisLabelRotation: 30
  y_axis_title: Share of submitted reports
  y_axis_title_margin: 60
  y_axis_format: ".1%"
  y_axis_bounds: [0, 1]
  truncateYAxis: false
  rich_tooltip: true
  showTooltipTotal: false
  tooltipTimeFormat: "%b %Y"
  show_value: false
  zoomable: false
query_context: null
