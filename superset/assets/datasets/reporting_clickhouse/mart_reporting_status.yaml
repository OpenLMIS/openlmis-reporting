  - column_name: reporting_status
    verbose_name: Reporting Status
    is_dttm: false
    is_active: true
    type: String
    groupby: true
    filterable: true
    expression: null
    description: "Reported when a SUBMITTED requisition exists for this facility, program and period; Skipped when the facility deliberately skipped the period instead; Did not report otherwise. Every program in the data has periods_skippable set, so a skip is a legitimate outcome, not a data error."
  - column_name: submitted_date
    verbose_name: Submitted At
    is_dttm: true
