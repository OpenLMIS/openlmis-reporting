  - column_name: submitted_week_of_month
    verbose_name: Submitted Week of Month
    is_dttm: false
    is_active: true
    type: UInt8
    groupby: true
    filterable: true
    expression: null
    description: null
  - column_name: report_timeliness
    verbose_name: Report Timeliness
    is_dttm: false
    is_active: true
    type: String
    groupby: true
    filterable: true
    expression: null
    description: "Bucket of day-of-month when the report was submitted: 'Before 15th' / 'Between 16th - 20th' / 'After 20th'. Null for non-reports."
  - column_name: period_year
    verbose_name: Year
    is_dttm: false
    is_active: true
    type: String
    groupby: true
    filterable: true
    expression: "toString(toYear(period_end_date))"
    description: "Calendar year of the period end date (string for grouping). Used by the Annual Reporting Rate chart."
  - column_name: in_complete_month
    verbose_name: In Complete Month
    is_dttm: false
    is_active: true
    type: UInt8
    groupby: true
    filterable: true
    expression: null
    description: "1 when the row's month reached the completeness threshold (see mart_month_completeness); trend charts hide incomplete trailing months through this flag"
  - column_name: in_latest_complete_month
    verbose_name: In Latest Complete Month
    is_dttm: false
    is_active: true
    type: UInt8
    groupby: true
    filterable: true
    expression: null
    description: "1 for rows in the most recent complete reporting month; the latest-month snapshot charts anchor on it"
  - column_name: on_time_through_day
    verbose_name: On time through day
    is_dttm: false
    is_active: true
    type: BIGINT
    groupby: true
    filterable: true
    expression: "toDayOfMonth(submitted_date)"
    description: "Day of the month a report was submitted. Exists so the dashboard can offer an adjustable on-time cut-off; the filter that targets it supplies the boundary and does not itself filter rows."
  - column_name: late_through_day
    verbose_name: Late through day
    is_dttm: false
    is_active: true
    type: BIGINT
    groupby: true
    filterable: true
    expression: "toDayOfMonth(submitted_date)"
    description: "Day of the month a report was submitted. Exists so the dashboard can offer an adjustable late cut-off; the filter that targets it supplies the boundary and does not itself filter rows."
  - column_name: submission_timeliness
    verbose_name: Submission Timeliness
    is_dttm: false
    is_active: true
    type: String
    groupby: true
    filterable: true
    expression: |
      {% set a = (filter_values('on_time_through_day', remove_filter=True) or [10])[0] | int(10) %}
      {% set b = (filter_values('late_through_day', remove_filter=True) or [15])[0] | int(15) %}
      {# the two cut-offs are read as a range, so an on-time day set later than the late day
         cannot silently delete the middle bucket #}
      {% set lo = [a, b] | min %}
      {% set hi = [a, b] | max %}
      CASE WHEN submitted_date IS NULL THEN NULL
           WHEN toDayOfMonth(submitted_date) <= {{ lo }} THEN 'On time'
           WHEN toDayOfMonth(submitted_date) <= {{ hi }} THEN 'Late'
           ELSE 'Extreme late' END
    description: "When in the month the report was submitted, against the cut-offs set in the dashboard filter bar. Defaults to 1st to 10th on time, 11th to 15th late, 16th onwards extreme late. Null for obligations with no submission date, which are the non-reports rather than reports of unknown date, so charts on this column filter to Reported first."
metrics:
  - metric_name: submission_day
    verbose_name: "Submission day of month"
    metric_type: null
    expression: "MIN(toDayOfMonth(submitted_date))"
    description: "The day of the month itself, used only to sort the timeliness cut-off filters numerically instead of alphabetically."
    d3format: ",.0f"
    extra: null
    warning_text: null
  - metric_name: latest_period_end
    verbose_name: "Latest Period End"
    metric_type: null
    expression: "MAX(period_end_date)"
    description: "Most recent period end date; used by the dashboard Period filters to sort their values chronologically."
    d3format: null
    extra: null
    warning_text: null
  - metric_name: count
    verbose_name: "COUNT(*)"
    metric_type: count
    expression: "COUNT(*)"
    description: Total reporting obligations (rows)
    d3format: ",.0f"
    extra: null
    warning_text: null
  - metric_name: reporting_rate_excl_skipped
    verbose_name: "Reporting Rate (excl. skipped)"
    metric_type: null
    expression: "AVG(CASE WHEN reporting_status = 'Skipped' THEN NULL WHEN reporting_status = 'Reported' THEN 1.0 ELSE 0.0 END)"
    description: "Alternative to reporting_rate that drops deliberately skipped periods from the denominator instead of counting them as misses (ClickHouse AVG ignores NULLs). Defined and deliberately unused: swapping a chart onto it is the whole cost of changing the skip policy, so the decision stays a chart-config change rather than a mart rebuild."
    d3format: ".1%"
    extra: null
    warning_text: null
  - metric_name: reporting_rate
    verbose_name: "Reporting Rate"
    metric_type: null
    expression: "AVG(CASE WHEN reporting_status = 'Reported' THEN 1.0 ELSE 0.0 END)"
    description: Fraction of reporting obligations that were submitted (matches legacy Reporting rate metric semantics)
    d3format: ".1%"
    extra: null
    warning_text: null
  - metric_name: reported_count
    verbose_name: "Reports Submitted"
    metric_type: null
    expression: "SUM(CASE WHEN reporting_status = 'Reported' THEN 1 ELSE 0 END)"
    description: Number of submitted requisitions across the visible scope
    d3format: ",.0f"
    extra: null
    warning_text: null
  - metric_name: missed_count
    verbose_name: "Reports Missed"
    metric_type: null
    expression: "SUM(CASE WHEN reporting_status = 'Did not report' THEN 1 ELSE 0 END)"
    description: Number of missed reporting obligations across the visible scope
    d3format: ",.0f"
    extra: null
    warning_text: null
