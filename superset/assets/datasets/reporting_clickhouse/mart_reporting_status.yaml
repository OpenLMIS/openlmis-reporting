table_name: mart_reporting_status
uuid: "a1b2c3d4-e5f6-4a7b-8c9d-000000000030"
version: "1.0.0"
database_uuid: "b1a2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d"
schema: curated
main_dttm_col: period_end_date
description: "Reporting outcome per (facility × program × period) — both Reported and Did not report rows, plus submission timing for the timeliness chart."
default_endpoint: null
offset: 0
cache_timeout: null
sql: |
  select
    s.*,
    if(f.family = '', 1, f.is_complete)        as in_complete_month,
    if(f.family = '', 0, f.is_latest_complete) as in_latest_complete_month
  from curated.mart_reporting_status s
  left join (
    select family, month, is_complete, is_latest_complete
    from curated.mart_month_completeness
    where family = 'reporting'
  ) f on f.month = toStartOfMonth(s.period_end_date)
